test_metadata:
  type: config
  name: multiple_secrets
  description: Test with multiple secrets with different configurations

secrets:
  app_credentials:
    secret_name: "${EnvironmentName}/app-credentials"
    generate_string_key: password
    secret_string_template: '{"username":"app_user"}'
    exclude_characters: '"@/\'
    password_length: 64
    exclude_lowercase: false
    exclude_numbers: false
    exclude_punctuation: false
    exclude_uppercase: false
    include_space: false
    require_each_included_type: true
  api_key:
    secret_name: "${EnvironmentName}/api-key"
    generate_string_key: api_key
    secret_string_template: '{"service":"myapi"}'
    exclude_characters: '"'
    password_length: 48
    exclude_lowercase: false
    exclude_numbers: false
    exclude_punctuation: true
    exclude_uppercase: false
    include_space: false
    require_each_included_type: false
  db_password:
    generate_string_key: password
    secret_string_template: '{"username":"dbadmin"}'
    exclude_characters: '"@/\;+%'
    password_length: 16
    exclude_lowercase: false
    exclude_numbers: false
    exclude_punctuation: false
    exclude_uppercase: true
    include_space: false
    require_each_included_type: true
